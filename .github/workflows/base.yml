name: Build base Docker images

on:
  push:
  schedule:
    - cron: "0 3 * * SAT"
  workflow_dispatch:

env:
  IMAGE_NAME: base

jobs:
  build:
    name: build base
    runs-on: [self-hosted, heavy-build]
    needs: []
    strategy:
      fail-fast: false
      matrix:
        IMAGE_TAG: [24.04, 26.04]
    steps:
      - uses: actions/checkout@v6
      - name: docker build
        uses: kubasejdak-org/docker-action/build-base@main
        with:
          image: ${{ env.IMAGE_NAME }}
          tag: ${{ matrix.IMAGE_TAG }}
          workdir: ${{ env.IMAGE_NAME }}/${{ matrix.IMAGE_TAG }}

  check-all-base:
    runs-on: [self-hosted, heavy-build]
    if: always()
    needs: build
    steps:
      - name: Check all jobs
        run: '! echo ''${{ toJSON(needs.*.result) }}'' | grep -qE ''"(failure|cancelled|skipped)"'''

  deploy:
    name: deploy base
    runs-on: [self-hosted, heavy-build]
    if: github.ref_name == 'main'
    needs: check-all-base
    strategy:
      matrix:
        IMAGE_TAG: [24.04, 26.04]
    steps:
      - name: docker push
        uses: kubasejdak-org/docker-action/push@main
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          image: ${{ env.IMAGE_NAME }}
          tag: ${{ matrix.IMAGE_TAG }}
